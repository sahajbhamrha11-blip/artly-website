services:
  artly:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: file:/data/artly.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - artly-data:/data

volumes:
  artly-data:
